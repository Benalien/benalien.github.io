<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Pattern Grid Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .video-container, .results-container {
            margin: 20px 0;
        }
        #videoElement, #canvasOutput, #debugCanvas {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: block;
            margin: 0 auto;
        }
        #canvasOutput, #debugCanvas {
            margin-top: 10px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #captureBtn {
            background-color: #f44336;
        }
        #captureBtn:hover {
            background-color: #d32f2f;
        }
        #manualBtn {
            background-color: #2196F3;
        }
        #manualBtn:hover {
            background-color: #0b7dda;
        }
        .grid-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        .drum-grid {
            border-collapse: collapse;
            margin: 0 auto;
        }
        .drum-grid th, .drum-grid td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            width: 30px;
            height: 30px;
        }
        .drum-grid th {
            background-color: #f2f2f2;
            font-weight: normal;
        }
        .drum-grid .instrument {
            background-color: #f2f2f2;
            font-weight: bold;
            text-align: right;
            padding-right: 15px;
            width: auto;
        }
        .filled {
            background-color: #333;
            position: relative;
        }
        .filled::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background-color: #555;
            border-radius: 2px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-style: italic;
            color: #666;
        }
        #exportSection {
            margin-top: 20px;
            display: none;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .debug-options {
            margin: 10px 0;
            text-align: center;
        }
        #debugCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Drum Pattern Grid Detector</h1>
        
        <div class="video-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasOutput"></canvas>
            <canvas id="debugCanvas"></canvas>
            <div class="debug-options">
                <label>
                    <input type="checkbox" id="showDebug"> Show Debug View
                </label>
            </div>
            <div class="button-container">
                <button id="startBtn">Start Camera</button>
                <button id="captureBtn" disabled>Capture Grid</button>
                <button id="manualBtn">Manual Mode</button>
            </div>
            <div class="status" id="status">Camera not started</div>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Processing image...</p>
        </div>
        
        <div class="results-container">
            <div class="grid-container" id="gridContainer"></div>
            
            <div id="exportSection">
                <h3>Export Pattern</h3>
                <div class="button-container">
                    <button id="copyBtn">Copy to Clipboard</button>
                </div>
                <textarea id="exportData" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('videoElement');
        const canvasOutput = document.getElementById('canvasOutput');
        const debugCanvas = document.getElementById('debugCanvas');
        const startButton = document.getElementById('startBtn');
        const captureButton = document.getElementById('captureBtn');
        const manualButton = document.getElementById('manualBtn');
        const statusText = document.getElementById('status');
        const gridContainer = document.getElementById('gridContainer');
        const loadingElement = document.getElementById('loading');
        const exportSection = document.getElementById('exportSection');
        const exportData = document.getElementById('exportData');
        const copyBtn = document.getElementById('copyBtn');
        const showDebugCheckbox = document.getElementById('showDebug');

        // Global variables
        let streaming = false;
        let stream = null;
        let detectedGrid = [];
        const instruments = ['KICK', 'HAT', 'SNARE', 'CLAP', 'TOM', 'CRASH', 'COW', 'TAMB'];
        const steps = 16;

        // Debug mode toggle
        showDebugCheckbox.addEventListener('change', function() {
            debugCanvas.style.display = this.checked ? 'block' : 'none';
        });

        // Start camera
        startButton.addEventListener('click', function() {
            if (streaming) {
                stopCamera();
                startButton.textContent = 'Start Camera';
                captureButton.disabled = true;
                statusText.textContent = 'Camera stopped';
            } else {
                startCamera();
            }
        });

        // Capture current frame
        captureButton.addEventListener('click', function() {
            captureFrame();
        });

        // Switch to manual mode
        manualButton.addEventListener('click', function() {
            // Hide camera elements
            video.style.display = 'none';
            canvasOutput.style.display = 'none';
            debugCanvas.style.display = 'none';
            showDebugCheckbox.parentElement.style.display = 'none';
            captureButton.disabled = true;
            
            // Show grid section
            exportSection.style.display = 'block';
            
            // Initialize manual mode
            manualDetectGrid();
        });

        // Copy exported data to clipboard
        copyBtn.addEventListener('click', function() {
            exportData.select();
            document.execCommand('copy');
            alert('Pattern copied to clipboard!');
        });

        function startCamera() {
            const constraints = {
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'environment'
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(s) {
                    stream = s;
                    video.srcObject = s;
                    video.play();
                    
                    // Set canvas size once video metadata is loaded
                    video.addEventListener('loadedmetadata', function() {
                        canvasOutput.width = video.videoWidth;
                        canvasOutput.height = video.videoHeight;
                        debugCanvas.width = video.videoWidth;
                        debugCanvas.height = video.videoHeight;
                    });
                    
                    streaming = true;
                    startButton.textContent = 'Stop Camera';
                    captureButton.disabled = false;
                    statusText.textContent = 'Camera active. Position the grid sheet in view and press "Capture Grid".';
                })
                .catch(function(err) {
                    console.error("An error occurred: " + err);
                    statusText.textContent = 'Error: Could not access camera. ' + err.message;
                });
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => {
                    track.stop();
                });
            }
            video.srcObject = null;
            streaming = false;
        }

        // Capture current frame and process it
        function captureFrame() {
            if (!streaming) return;

            loadingElement.style.display = 'block';
            statusText.textContent = 'Processing image...';
            captureButton.disabled = true;

            // Using setTimeout to allow the UI to update before processing
            setTimeout(() => {
                try {
                    const ctx = canvasOutput.getContext('2d');
                    canvasOutput.width = video.videoWidth;
                    canvasOutput.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);
                    
                    // Process the image
                    processImage(canvasOutput);
                } catch (err) {
                    console.error('Error processing frame:', err);
                    statusText.textContent = 'Error processing image: ' + err.message;
                    loadingElement.style.display = 'none';
                    captureButton.disabled = false;
                }
            }, 100);
        }

        function processImage(canvas) {
            try {
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                
                // Get image data
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                // Create grayscale version for processing
                const grayscale = new Uint8Array(width * height);
                for (let i = 0; i < data.length; i += 4) {
                    // Convert RGB to grayscale using luminance formula
                    grayscale[i/4] = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                }
                
                // Draw grayscale image on debug canvas
                if (showDebugCheckbox.checked) {
                    const debugCtx = debugCanvas.getContext('2d');
                    const debugImageData = debugCtx.createImageData(width, height);
                    const debugData = debugImageData.data;
                    
                    for (let i = 0; i < grayscale.length; i++) {
                        const val = grayscale[i];
                        const offset = i * 4;
                        debugData[offset] = val;
                        debugData[offset + 1] = val;
                        debugData[offset + 2] = val;
                        debugData[offset + 3] = 255;
                    }
                    
                    debugCtx.putImageData(debugImageData, 0, 0);
                }
                
                // Find registration marks
                const registrationMarks = findRegistrationMarks(grayscale, width, height);
                
                if (registrationMarks.length === 4) {
                    // Sort registration marks in order: top-left, top-right, bottom-right, bottom-left
                    sortRegistrationMarks(registrationMarks);
                    
                    // Draw the marks on the output canvas for debugging
                    drawRegistrationMarks(ctx, registrationMarks);
                    
                    // Define the grid area based on registration marks
                    const gridArea = defineGridArea(registrationMarks);
                    
                    // Detect the grid cells
                    detectedGrid = detectGridCells(grayscale, width, height, gridArea);
                    
                    // Display the results
                    displayResults(detectedGrid);
                    
                    statusText.textContent = 'Grid detected and processed successfully!';
                } else {
                    displayError(`Found ${registrationMarks.length} registration marks, need exactly 4. Please try again with better lighting and alignment.`);
                }
            } catch (err) {
                console.error('Error in processImage:', err);
                displayError("Error processing image: " + err.message);
            } finally {
                loadingElement.style.display = 'none';
                captureButton.disabled = false;
            }
        }

        function findRegistrationMarks(grayscale, width, height) {
            // Perform basic thresholding
            const threshold = 100; // Threshold for black (adjust as needed)
            const binaryImage = new Uint8Array(grayscale.length);
            
            for (let i = 0; i < grayscale.length; i++) {
                binaryImage[i] = grayscale[i] < threshold ? 1 : 0; // 1 for black, 0 for white
            }
            
            // Draw binary image on debug canvas if debug mode is on
            if (showDebugCheckbox.checked) {
                const debugCtx = debugCanvas.getContext('2d');
                const debugImageData = debugCtx.createImageData(width, height);
                const debugData = debugImageData.data;
                
                for (let i = 0; i < binaryImage.length; i++) {
                    const val = binaryImage[i] ? 0 : 255;
                    const offset = i * 4;
                    debugData[offset] = val;
                    debugData[offset + 1] = val;
                    debugData[offset + 2] = val;
                    debugData[offset + 3] = 255;
                }
                
                debugCtx.putImageData(debugImageData, 0, 0);
            }
            
            // Scan the image in sections looking for registration marks
            // Registration marks are square black patterns in the corners
            const sections = [
                { x: 0, y: 0, width: width / 3, height: height / 3 }, // Top-left
                { x: width * 2/3, y: 0, width: width / 3, height: height / 3 }, // Top-right
                { x: width * 2/3, y: height * 2/3, width: width / 3, height: height / 3 }, // Bottom-right
                { x: 0, y: height * 2/3, width: width / 3, height: height / 3 } // Bottom-left
            ];
            
            const registrationMarks = [];
            
            // For each corner section, find a potential registration mark
            sections.forEach(section => {
                const mark = findRegistrationMarkInSection(binaryImage, width, height, section);
                if (mark) {
                    registrationMarks.push(mark);
                }
            });
            
            return registrationMarks;
        }

        function findRegistrationMarkInSection(binaryImage, width, height, section) {
            const startX = Math.floor(section.x);
            const startY = Math.floor(section.y);
            const endX = Math.floor(section.x + section.width);
            const endY = Math.floor(section.y + section.height);
            
            // We're looking for a dense black square
            const minSize = Math.min(width, height) * 0.02; // Minimum size for a registration mark
            const maxSize = Math.min(width, height) * 0.15; // Maximum size for a registration mark
            
            // Initialize variables to track the best candidate
            let bestCandidate = null;
            let bestScore = 0;
            
            // Scan in a grid pattern to avoid checking every pixel
            const step = Math.floor(minSize / 4);
            
            for (let y = startY; y < endY; y += step) {
                for (let x = startX; x < endX; x += step) {
                    // Skip if we're too close to the edge
                    if (x < minSize || y < minSize || x > width - minSize || y > height - minSize) {
                        continue;
                    }
                    
                    // Check if this is a potential center of a registration mark
                    if (binaryImage[y * width + x] === 1) { // If this pixel is black
                        // Scan different sizes from the minimum to maximum
                        for (let size = Math.floor(minSize); size <= Math.floor(maxSize); size += step) {
                            const halfSize = Math.floor(size / 2);
                            
                            // Count black pixels in this square
                            let blackCount = 0;
                            let totalPixels = 0;
                            
                            for (let sy = y - halfSize; sy <= y + halfSize; sy++) {
                                for (let sx = x - halfSize; sx <= x + halfSize; sx++) {
                                    // Check bounds
                                    if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                                        totalPixels++;
                                        if (binaryImage[sy * width + sx] === 1) {
                                            blackCount++;
                                        }
                                    }
                                }
                            }
                            
                            // Calculate the black pixel ratio
                            const blackRatio = blackCount / totalPixels;
                            
                            // Registration marks should have a high density of black pixels (>50%)
                            if (blackRatio > 0.5 && blackRatio > bestScore) {
                                bestScore = blackRatio;
                                bestCandidate = {
                                    center: { x, y },
                                    size: size,
                                    blackRatio: blackRatio
                                };
                            }
                        }
                    }
                }
            }
            
            return bestCandidate;
        }

        function sortRegistrationMarks(marks) {
            // Calculate center of all marks
            let centerX = marks.reduce((sum, mark) => sum + mark.center.x, 0) / marks.length;
            let centerY = marks.reduce((sum, mark) => sum + mark.center.y, 0) / marks.length;
            
            // Categorize each mark as top-left, top-right, bottom-right, or bottom-left
            marks.forEach(mark => {
                mark.isLeft = mark.center.x < centerX;
                mark.isTop = mark.center.y < centerY;
            });
            
            // Sort based on their position
            marks.sort((a, b) => {
                if (a.isTop !== b.isTop) return a.isTop ? -1 : 1;
                if (a.isLeft !== b.isLeft) return a.isLeft ? -1 : 1;
                return 0;
            });
            
            // Ensure we have exactly 4 marks and they are in correct order:
            // 0: top-left, 1: top-right, 2: bottom-right, 3: bottom-left
            while (marks.length > 4) marks.pop();
            
            // Make sure marks are properly ordered
            if (marks.length === 4) {
                const expectedPositions = [
                    { isTop: true, isLeft: true },   // top-left
                    { isTop: true, isLeft: false },  // top-right
                    { isTop: false, isLeft: false }, // bottom-right
                    { isTop: false, isLeft: true }   // bottom-left
                ];
                
                for (let i = 0; i < 4; i++) {
                    if (marks[i].isTop !== expectedPositions[i].isTop || marks[i].isLeft !== expectedPositions[i].isLeft) {
                        // If position doesn't match, try to find the correct mark
                        for (let j = i + 1; j < 4; j++) {
                            if (marks[j].isTop === expectedPositions[i].isTop && marks[j].isLeft === expectedPositions[i].isLeft) {
                                // Swap to correct position
                                [marks[i], marks[j]] = [marks[j], marks[i]];
                                break;
                            }
                        }
                    }
                }
            }
        }

        function drawRegistrationMarks(ctx, marks) {
            ctx.lineWidth = 3;
            
            // Color coding for different corners
            const colors = ['red', 'green', 'blue', 'purple'];
            
            marks.forEach((mark, index) => {
                const halfSize = mark.size / 2;
                ctx.strokeStyle = colors[index % colors.length];
                ctx.beginPath();
                ctx.rect(
                    mark.center.x - halfSize, 
                    mark.center.y - halfSize,
                    mark.size,
                    mark.size
                );
                ctx.stroke();
                
                // Draw center point
                ctx.beginPath();
                ctx.arc(mark.center.x, mark.center.y, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Label
                ctx.fillStyle = colors[index % colors.length];
                ctx.font = '16px Arial';
                ctx.fillText(index, mark.center.x + halfSize + 5, mark.center.y);
            });
        }

        function defineGridArea(marks) {
            // Define the grid area using the 4 registration marks
            // This creates a mapping to help us sample grid cells even with perspective distortion
            return {
                topLeft: marks[0].center,
                topRight: marks[1].center,
                bottomRight: marks[2].center,
                bottomLeft: marks[3].center
            };
        }

        function detectGridCells(grayscale, width, height, gridArea) {
            // Grid dimensions
            const numRows = 8;  // 8 instruments
            const numCols = 16; // 16 time steps
            
            // Initialize result grid
            let grid = Array(numRows).fill().map(() => Array(numCols).fill(false));
            
            // For each cell, check if it's filled
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numCols; col++) {
                    // Calculate normalized cell position (0-1 range for both x and y)
                    const cellX = (col + 0.5) / numCols;
                    const cellY = (row + 0.5) / numRows;
                    
                    // Map to actual pixel coordinates using bilinear interpolation
                    const point = mapPointToQuad(
                        cellX, cellY,
                        gridArea.topLeft,
                        gridArea.topRight,
                        gridArea.bottomRight,
                        gridArea.bottomLeft
                    );
                    
                    // Sample area around the point to determine if cell is filled
                    const sampleSize = Math.min(
                        distanceBetweenPoints(gridArea.topLeft, gridArea.topRight) / numCols,
                        distanceBetweenPoints(gridArea.topLeft, gridArea.bottomLeft) / numRows
                    ) * 0.3;
                    
                    let blackPixelCount = 0;
                    let totalPixels = 0;
                    
                    for (let dy = -sampleSize; dy <= sampleSize; dy += 1) {
                        for (let dx = -sampleSize; dx <= sampleSize; dx += 1) {
                            const sampleX = Math.round(point.x + dx);
                            const sampleY = Math.round(point.y + dy);
                            
                            // Check if sample point is within image bounds
                            if (sampleX >= 0 && sampleX < width && sampleY >= 0 && sampleY < height) {
                                const pixelIndex = sampleY * width + sampleX;
                                const pixelValue = grayscale[pixelIndex];
                                
                                totalPixels++;
                                // Check if pixel is dark (potential fill)
                                if (pixelValue < 100) {
                                    blackPixelCount++;
                                }
                            }
                        }
                    }
                    
                    // If enough pixels are black, consider cell filled
                    const blackRatio = blackPixelCount / totalPixels;
                    grid[row][col] = blackRatio > 0.3;
                }
            }
            
            return grid;
        }

        function mapPointToQuad(normalizedX, normalizedY, topLeft, topRight, bottomRight, bottomLeft) {
            // Maps a point in normalized coordinates (0-1) to actual pixel coordinates
            // using bilinear interpolation between the four corners of the quadrilateral
            
            // Top edge interpolation
            const topX = topLeft.x + normalizedX * (topRight.x - topLeft.x);
            const topY = topLeft.y + normalizedX * (topRight.y - topLeft.y);
            
            // Bottom edge interpolation
            const bottomX = bottomLeft.x + normalizedX * (bottomRight.x - bottomLeft.x);
            const bottomY = bottomLeft.y + normalizedX * (bottomRight.y - bottomLeft.y);
            
            // Final interpolation between top and bottom points
            return {
                x: topX + normalizedY * (bottomX - topX),
                y: topY + normalizedY * (bottomY - topY)
            };
        }

        function distanceBetweenPoints(p1, p2) {
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        function displayResults(grid) {
            // Create table
            let table = document.createElement('table');
            table.className = 'drum-grid';
            
            // Add header row with beat numbers
            let headerRow = document.createElement('tr');
            let cornerCell = document.createElement('th');
            headerRow.appendChild(cornerCell);
            
            for (let i = 1; i <= steps; i++) {
                let th = document.createElement('th');
                th.textContent = i;
                headerRow.appendChild(th);
            }
            
            table.appendChild(headerRow);
            
            // Add rows for each instrument
            for (let i = 0; i < instruments.length; i++) {
                let row = document.createElement('tr');
                
                // Instrument name
                let instrumentCell = document.createElement('td');
                instrumentCell.className = 'instrument';
                instrumentCell.textContent = instruments[i];
                row.appendChild(instrumentCell);
                
                // Cells for each step
                for (let j = 0; j < steps; j++) {
                    let cell = document.createElement('td');
                    if (grid[i][j]) {
                        cell.className = 'filled';
                    }
                    row.appendChild(cell);
                }
                
                table.appendChild(row);
            }
            
            // Clear previous results and add new table
            gridContainer.innerHTML = '';
            gridContainer.appendChild(table);
            
            // Generate export data
            generateExportData(grid);
            
            // Show export section
            exportSection.style.display = 'block';
        }

        // Manual mode for creating grid without image processing
        function manualDetectGrid() {
            const gridContainer = document.getElementById('gridContainer');
            // Create empty grid
            let emptyGrid = Array(instruments.length).fill().map(() => Array(steps).fill(false));
            displayResults(emptyGrid);
            
            // Make the table cells interactive
            const cells = document.querySelectorAll('.drum-grid td:not(.instrument)');
            cells.forEach(cell => {
                cell.style.cursor = 'pointer';
                cell.addEventListener('click', function() {
                    this.classList.toggle('filled');
                    
                    // Update the grid data
                    updateGridFromTable();
                });
            });
            
            document.getElementById('status').textContent = 'Manual mode activated. Click cells to toggle them on/off.';
            
            // Add a button to update grid data
            const updateBtn = document.createElement('button');
            updateBtn.textContent = 'Update Export Data';
            updateBtn.addEventListener('click', updateGridFromTable);
            document.querySelector('.button-container').appendChild(updateBtn);
        }
        
        function updateGridFromTable() {
            const rows = document.querySelectorAll('.drum-grid tr:not(:first-child)');
            let updatedGrid = Array(instruments.length).fill().map(() => Array(steps).fill(false));
            
            rows.forEach((row, rowIndex) => {
                const cells = row.querySelectorAll('td:not(.instrument)');
                cells.forEach((cell, colIndex) => {
                    updatedGrid[rowIndex][colIndex] = cell.classList.contains('filled');
                });
            });
            
            // Update export data
            generateExportData(updatedGrid);
        }

        function generateExportData(grid) {
            let data = {};
            
            // Create a pattern object
            for (let i = 0; i < instruments.length; i++) {
                data[instruments[i].toLowerCase()] = [];
                
                for (let j = 0; j < steps; j++) {
                    if (grid[i][j]) {
                        data[instruments[i].toLowerCase()].push(j + 1); // 1-based index for beats
                    }
                }
            }
            
            // Convert to JSON for export
            exportData.value = JSON.stringify(data, null, 2);
        }

        function displayError(message) {
            statusText.textContent = message;
            console.error(message);
        }

        // Initialize an empty grid on load
        function initializeEmptyGrid() {
            let emptyGrid = Array(instruments.length).fill().map(() => Array(steps).fill(false));
            displayResults(emptyGrid);
        }

        // Initialize when page loads
        window.addEventListener('load', function() {
            initializeEmptyGrid();
        });
    </script>
</body>
</html>
