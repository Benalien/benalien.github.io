<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Grid Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #videoContainer, #canvasOutput, #processedOutput {
            margin-top: 20px;
            max-width: 100%;
            border: 1px solid #ddd;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        .red {
            background-color: #f44336;
        }
        #resultsContainer {
            margin-top: 20px;
            text-align: left;
            border: 1px solid #ddd;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .cell-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 2px;
            margin-top: 20px;
        }
        .cell-grid-row {
            display: contents;
        }
        .grid-cell {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .filled {
            background-color: #000;
        }
        .row-label {
            text-align: right;
            padding-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Drum Grid Detector</h1>
        <p>This app detects filled cells in a drum grid pattern using your camera.</p>
        
        <div>
            <button id="startCamera" class="button">Start Camera</button>
            <button id="captureImage" class="button" disabled>Capture Image</button>
            <button id="processImage" class="button" disabled>Process Grid</button>
        </div>
        
        <div id="videoContainer">
            <video id="video" width="640" height="480" autoplay playsinline></video>
        </div>
        
        <canvas id="canvasOutput" width="640" height="480" style="display: none;"></canvas>
        <canvas id="processedOutput" width="640" height="480" style="display: none;"></canvas>
        
        <div id="gridVisualizer" style="margin-top: 20px;">
            <div class="cell-grid" id="resultGrid">
                <!-- Grid will be populated dynamically -->
            </div>
        </div>
        
        <div id="resultsContainer">
            <h3>Detected Filled Cells:</h3>
            <div id="results"></div>
        </div>
    </div>

    <!-- Load OpenCV.js -->
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.7.0/opencv.js"></script>

    <script>
        // Define global variables
        let video = document.getElementById('video');
        let startCameraButton = document.getElementById('startCamera');
        let captureButton = document.getElementById('captureImage');
        let processButton = document.getElementById('processImage');
        let canvasOutput = document.getElementById('canvasOutput');
        let processedOutput = document.getElementById('processedOutput');
        let resultsDiv = document.getElementById('results');
        let resultGrid = document.getElementById('resultGrid');
        
        // Define the row labels
        const rowLabels = ['KICK', 'HAT', 'SNARE', 'CLAP', 'TOM', 'CRASH', 'COW', 'TAMB'];
        
        // OpenCV.js loading status
        let cvReady = false;
        let stream = null;
        let capturedImage = null;
        
        // Wait for OpenCV.js to load
        function onOpenCvReady() {
            console.log('OpenCV.js is ready');
            cvReady = true;
            startCameraButton.disabled = false;
        }
        
        // Initialize the grid visualization
        function initializeGridVisualizer() {
            resultGrid.innerHTML = '';
            
            // Add row labels and cells
            for (let i = 0; i < 8; i++) {
                // Add row label
                const rowLabel = document.createElement('div');
                rowLabel.className = 'row-label';
                rowLabel.textContent = rowLabels[i];
                resultGrid.appendChild(rowLabel);
                
                // Create grid cells for this row
                const row = document.createElement('div');
                row.className = 'cell-grid-row';
                
                for (let j = 0; j < 16; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${i}-${j}`;
                    cell.setAttribute('data-row', i);
                    cell.setAttribute('data-col', j);
                    row.appendChild(cell);
                }
                
                resultGrid.appendChild(row);
            }
        }
        
        // Start camera
        startCameraButton.addEventListener('click', async () => {
            if (!cvReady) {
                alert('OpenCV.js is not ready yet. Please wait.');
                return;
            }
            
            try {
                // Get access to the camera
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                // Connect the camera stream to the video element
                video.srcObject = stream;
                video.style.display = 'block';
                startCameraButton.disabled = true;
                captureButton.disabled = false;
                
                // Initialize the grid visualizer
                initializeGridVisualizer();
                
            } catch (err) {
                console.error('Error accessing the camera: ', err);
                alert('Could not access the camera: ' + err.message);
            }
        });
        
        // Capture image
        captureButton.addEventListener('click', () => {
            if (!stream) {
                alert('Camera is not started yet.');
                return;
            }
            
            // Draw the current video frame onto the canvas
            const ctx = canvasOutput.getContext('2d');
            canvasOutput.width = video.videoWidth;
            canvasOutput.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);
            
            // Show the captured image
            canvasOutput.style.display = 'block';
            processButton.disabled = false;
            
            // Convert the image to an OpenCV matrix
            capturedImage = cv.imread(canvasOutput);
        });
        
        // Process the captured image
        processButton.addEventListener('click', () => {
            if (!capturedImage) {
                alert('No image captured yet.');
                return;
            }
            
            try {
                // Process the image to find the grid and detect filled cells
                processGridImage(capturedImage);
            } catch (err) {
                console.error('Error processing the image: ', err);
                alert('Error processing the image: ' + err.message);
            }
        });
        
        // Process the grid image to detect filled cells
        function processGridImage(inputImage) {
            // Create a copy of the input image for processing
            let src = inputImage.clone();
            let dst = new cv.Mat();
            let processedImg = new cv.Mat();
            
            // Convert to grayscale for easier processing
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
            
            // Apply adaptive threshold to handle different lighting conditions
            cv.adaptiveThreshold(dst, dst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);
            
            // Find contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(dst, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);
            
            // Draw contours on the original image for visualization
            processedImg = src.clone();
            
            // First, find the four registration marks (QR-like markers in corners)
            let markers = [];
            for (let i = 0; i < contours.size(); i++) {
                const contour = contours.get(i);
                const area = cv.contourArea(contour);
                
                // Filter by area to find potential registration marks
                if (area > 100 && area < 5000) {
                    let approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.02 * cv.arcLength(contour, true), true);
                    
                    // Registration marks should have approximately 8 vertices (inner and outer squares)
                    if (approx.rows >= 4 && approx.rows <= 12) {
                        // Calculate center of the contour
                        let moments = cv.moments(contour);
                        let cx = moments.m10 / moments.m00;
                        let cy = moments.m01 / moments.m00;
                        
                        markers.push({
                            contour: contour,
                            center: { x: cx, y: cy }
                        });
                        
                        // Draw the marker for visualization
                        cv.drawContours(processedImg, contours, i, [0, 255, 0, 255], 2);
                    }
                    
                    approx.delete();
                }
            }
            
            // We need exactly 4 registration marks
            if (markers.length < 4) {
                alert('Could not detect all 4 registration marks. Found: ' + markers.length);
                src.delete();
                dst.delete();
                processedImg.delete();
                contours.delete();
                hierarchy.delete();
                return;
            }
            
            // Sort markers by position (top-left, top-right, bottom-left, bottom-right)
            let sumCoords = markers.map(m => ({ marker: m, sum: m.center.x + m.center.y }));
            let diffCoords = markers.map(m => ({ marker: m, diff: m.center.x - m.center.y }));
            
            sumCoords.sort((a, b) => a.sum - b.sum);
            diffCoords.sort((a, b) => a.diff - b.diff);
            
            let topLeft = sumCoords[0].marker;
            let bottomRight = sumCoords[sumCoords.length - 1].marker;
            let topRight = diffCoords[diffCoords.length - 1].marker;
            let bottomLeft = diffCoords[0].marker;
            
            // Define the source points for perspective transform
            let srcPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                topLeft.center.x, topLeft.center.y,
                topRight.center.x, topRight.center.y,
                bottomLeft.center.x, bottomLeft.center.y,
                bottomRight.center.x, bottomRight.center.y
            ]);
            
            // Define the destination points (a perfect rectangle)
            const destWidth = 800;
            const destHeight = 400;
            let dstPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,
                destWidth, 0,
                0, destHeight,
                destWidth, destHeight
            ]);
            
            // Compute perspective transform matrix
            let transformMatrix = cv.getPerspectiveTransform(srcPoints, dstPoints);
            
            // Apply perspective transform
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, transformMatrix, new cv.Size(destWidth, destHeight));
            
            // Create a grid for cell detection (8 rows, 16 columns)
            const rows = 8;
            const cols = 16;
            const cellWidth = destWidth / cols;
            const cellHeight = destHeight / rows;
            
            // Convert warped image to grayscale
            let warpedGray = new cv.Mat();
            cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY);
            
            // Apply threshold to make filled cells more apparent
            cv.threshold(warpedGray, warpedGray, 120, 255, cv.THRESH_BINARY_INV);
            
            // Store the detected filled cells
            let filledCells = [];
            
            // Clear previous results
            while (resultsDiv.firstChild) {
                resultsDiv.removeChild(resultsDiv.firstChild);
            }
            
            // Reset grid visualization
            const gridCells = document.querySelectorAll('.grid-cell');
            gridCells.forEach(cell => {
                cell.classList.remove('filled');
            });
            
            // Check each cell to see if it's filled
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    // Define the ROI (Region of Interest) for this cell
                    let x = Math.floor(col * cellWidth);
                    let y = Math.floor(row * cellHeight);
                    let width = Math.floor(cellWidth);
                    let height = Math.floor(cellHeight);
                    
                    let cellROI = warpedGray.roi(new cv.Rect(x, y, width, height));
                    
                    // Count black pixels (potential filled areas)
                    let pixelCount = 0;
                    let totalPixels = cellROI.rows * cellROI.cols;
                    
                    // Calculate the mean value - lower value means more dark pixels
                    let meanVal = cv.mean(cellROI)[0];
                    
                    // If mean value is less than threshold, consider the cell filled
                    // Adjust threshold as needed based on testing
                    if (meanVal < 100) {
                        const cellName = `${rowLabels[row]}-${col + 1}`;
                        filledCells.push({
                            row: row,
                            col: col,
                            name: cellName
                        });
                        
                        // Add to results display
                        const resultItem = document.createElement('div');
                        resultItem.textContent = cellName;
                        resultsDiv.appendChild(resultItem);
                        
                        // Update grid visualization
                        const cell = document.getElementById(`cell-${row}-${col}`);
                        if (cell) {
                            cell.classList.add('filled');
                        }
                        
                        // Draw rectangle on processed image for visualization
                        let color = new cv.Scalar(0, 0, 255, 255);
                        let point1 = new cv.Point(x, y);
                        let point2 = new cv.Point(x + width, y + height);
                        cv.rectangle(warped, point1, point2, color, 2);
                    }
                    
                    cellROI.delete();
                }
            }
            
            // Display results
            if (filledCells.length === 0) {
                const resultItem = document.createElement('div');
                resultItem.textContent = 'No filled cells detected.';
                resultsDiv.appendChild(resultItem);
            } else {
                console.log('Filled cells:', filledCells);
            }
            
            // Show the processed image
            cv.imshow('processedOutput', warped);
            processedOutput.style.display = 'block';
            
            // Clean up
            src.delete();
            dst.delete();
            processedImg.delete();
            warped.delete();
            warpedGray.delete();
            contours.delete();
            hierarchy.delete();
            srcPoints.delete();
            dstPoints.delete();
            transformMatrix.delete();
        }
        
        // Check if OpenCV.js is already loaded
        if (typeof cv !== 'undefined') {
            onOpenCvReady();
        } else {
            // If not loaded yet, set a callback
            window.onOpenCvReady = onOpenCvReady;
        }
    </script>
</body>
</html>
