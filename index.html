<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Pattern Grid Detector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.5.5/opencv.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .video-container, .results-container {
            margin: 20px 0;
        }
        #videoElement, #canvasOutput {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: block;
            margin: 0 auto;
        }
        #canvasOutput {
            margin-top: 10px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            gap: 10px;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #captureBtn {
            background-color: #f44336;
        }
        #captureBtn:hover {
            background-color: #d32f2f;
        }
        .grid-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        .drum-grid {
            border-collapse: collapse;
            margin: 0 auto;
        }
        .drum-grid th, .drum-grid td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .drum-grid th {
            background-color: #f2f2f2;
            font-weight: normal;
        }
        .drum-grid .instrument {
            background-color: #f2f2f2;
            font-weight: bold;
            text-align: right;
            padding-right: 15px;
        }
        .filled {
            background-color: #333;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-style: italic;
            color: #666;
        }
        #exportSection {
            margin-top: 20px;
            display: none;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Drum Pattern Grid Detector</h1>
        
        <div class="video-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasOutput"></canvas>
            <div class="button-container">
                <button id="startBtn">Start Camera</button>
                <button id="captureBtn" disabled>Capture Grid</button>
            </div>
            <div class="status" id="status">Camera not started</div>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Processing image...</p>
        </div>
        
        <div class="results-container">
            <div class="grid-container" id="gridContainer"></div>
            
            <div id="exportSection">
                <h3>Export Pattern</h3>
                <div class="button-container">
                    <button id="copyBtn">Copy to Clipboard</button>
                </div>
                <textarea id="exportData" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Wait for OpenCV.js to be loaded
        function onOpenCvReady() {
            document.getElementById('status').textContent = 'OpenCV.js loaded. Press "Start Camera" to begin.';
            document.getElementById('startBtn').disabled = false;
        }

        // Variables
        let video = document.getElementById('videoElement');
        let canvasOutput = document.getElementById('canvasOutput');
        let startButton = document.getElementById('startBtn');
        let captureButton = document.getElementById('captureBtn');
        let statusText = document.getElementById('status');
        let gridContainer = document.getElementById('gridContainer');
        let loadingElement = document.getElementById('loading');
        let exportSection = document.getElementById('exportSection');
        let exportData = document.getElementById('exportData');
        let copyBtn = document.getElementById('copyBtn');

        let streaming = false;
        let stream = null;
        let detectedGrid = [];
        const instruments = ['KICK', 'HAT', 'SNARE', 'CLAP', 'TOM', 'CRASH', 'COW', 'TAMB'];
        const steps = 16;

        // Start camera
        startButton.addEventListener('click', function() {
            if (streaming) {
                stopCamera();
                startButton.textContent = 'Start Camera';
                captureButton.disabled = true;
                statusText.textContent = 'Camera stopped';
            } else {
                startCamera();
            }
        });

        // Capture current frame
        captureButton.addEventListener('click', function() {
            captureFrame();
        });

        // Copy exported data to clipboard
        copyBtn.addEventListener('click', function() {
            exportData.select();
            document.execCommand('copy');
            alert('Pattern copied to clipboard!');
        });

        function startCamera() {
            const constraints = {
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'environment'
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(s) {
                    stream = s;
                    video.srcObject = s;
                    video.play();
                    streaming = true;
                    startButton.textContent = 'Stop Camera';
                    captureButton.disabled = false;
                    statusText.textContent = 'Camera active. Position the grid sheet in view and press "Capture Grid".';
                })
                .catch(function(err) {
                    console.error("An error occurred: " + err);
                    statusText.textContent = 'Error: Could not access camera. ' + err.message;
                });
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => {
                    track.stop();
                });
            }
            video.srcObject = null;
            streaming = false;
        }

        // Capture current frame and process it
        function captureFrame() {
            if (!streaming) return;

            loadingElement.style.display = 'block';
            statusText.textContent = 'Processing image...';
            captureButton.disabled = true;

            // Using setTimeout to allow the UI to update before processing
            setTimeout(() => {
                try {
                    const ctx = canvasOutput.getContext('2d');
                    canvasOutput.width = video.videoWidth;
                    canvasOutput.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);
                    
                    const imgData = ctx.getImageData(0, 0, canvasOutput.width, canvasOutput.height);
                    
                    // Process the image using OpenCV
                    let src = cv.matFromImageData(imgData);
                    processImage(src);
                    
                    src.delete();
                } catch (err) {
                    console.error('Error processing frame:', err);
                    statusText.textContent = 'Error processing image: ' + err.message;
                    loadingElement.style.display = 'none';
                    captureButton.disabled = false;
                }
            }, 100);
        }

        function processImage(src) {
            try {
                // Convert to grayscale
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                // Apply threshold to get binary image
                let binary = new cv.Mat();
                cv.threshold(gray, binary, 150, 255, cv.THRESH_BINARY_INV);
                
                // Find contours
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(binary, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                
                // Find the registration marks (the QR-code-like squares in corners)
                let registrationMarks = findRegistrationMarks(contours, src.cols, src.rows);
                
                if (registrationMarks.length === 4) {
                    // Sort registration marks in order: top-left, top-right, bottom-right, bottom-left
                    sortRegistrationMarks(registrationMarks);
                    
                    // Apply perspective transform
                    let transformedImage = applyPerspectiveTransform(gray, registrationMarks);
                    
                    // Detect the grid cells
                    detectedGrid = detectGridCells(transformedImage);
                    
                    // Display the results
                    displayResults(detectedGrid);
                    
                    transformedImage.delete();
                    
                    statusText.textContent = 'Grid detected and processed successfully!';
                } else {
                    displayError("Could not detect all 4 registration marks. Please try again with better lighting and alignment.");
                }
                
                // Clean up
                gray.delete();
                binary.delete();
                contours.delete();
                hierarchy.delete();
            } catch (err) {
                console.error('Error in processImage:', err);
                displayError("Error processing image: " + err.message);
            } finally {
                loadingElement.style.display = 'none';
                captureButton.disabled = false;
            }
        }

        function findRegistrationMarks(contours, width, height) {
            const minSize = Math.min(width, height) * 0.02; // Min size of registration mark
            const maxSize = Math.min(width, height) * 0.15; // Max size of registration mark
            
            let possibleMarks = [];
            
            for (let i = 0; i < contours.size(); ++i) {
                const contour = contours.get(i);
                const area = cv.contourArea(contour);
                
                // Skip if too small or too large
                if (area < minSize * minSize || area > maxSize * maxSize) continue;
                
                // Check if it's approximately square
                let perimeter = cv.arcLength(contour, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(contour, approx, 0.04 * perimeter, true);
                
                if (approx.rows === 4) {
                    let rect = cv.boundingRect(contour);
                    let aspectRatio = rect.width / rect.height;
                    
                    // Check if it's square-ish (aspect ratio close to 1)
                    if (aspectRatio > 0.8 && aspectRatio < 1.2) {
                        let center = {
                            x: rect.x + rect.width / 2,
                            y: rect.y + rect.height / 2
                        };
                        possibleMarks.push({
                            center: center,
                            rect: rect,
                            contour: contour
                        });
                    }
                }
                
                approx.delete();
            }
            
            // If we found too many possible marks, filter by position (likely in the corners)
            if (possibleMarks.length > 4) {
                // Calculate distance from each corner
                possibleMarks.forEach(mark => {
                    mark.distTL = distanceSquared(mark.center, {x: 0, y: 0});
                    mark.distTR = distanceSquared(mark.center, {x: width, y: 0});
                    mark.distBR = distanceSquared(mark.center, {x: width, y: height});
                    mark.distBL = distanceSquared(mark.center, {x: 0, y: height});
                    mark.minDist = Math.min(mark.distTL, mark.distTR, mark.distBR, mark.distBL);
                });
                
                // Sort by minimum distance to any corner
                possibleMarks.sort((a, b) => a.minDist - b.minDist);
                
                // Take the top 4
                possibleMarks = possibleMarks.slice(0, 4);
            }
            
            return possibleMarks;
        }

        function distanceSquared(p1, p2) {
            return Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2);
        }

        function sortRegistrationMarks(marks) {
            // Calculate center of all marks
            let centerX = marks.reduce((sum, mark) => sum + mark.center.x, 0) / marks.length;
            let centerY = marks.reduce((sum, mark) => sum + mark.center.y, 0) / marks.length;
            
            // Categorize each mark as top-left, top-right, bottom-right, or bottom-left
            marks.forEach(mark => {
                mark.isLeft = mark.center.x < centerX;
                mark.isTop = mark.center.y < centerY;
            });
            
            // Sort based on their position
            marks.sort((a, b) => {
                if (a.isTop && !b.isTop) return -1;
                if (!a.isTop && b.isTop) return 1;
                if (a.isLeft && !b.isLeft) return -1;
                if (!a.isLeft && b.isLeft) return 1;
                return 0;
            });
            
            // Now the marks should be in order: top-left, top-right, bottom-right, bottom-left
            // Reorder to ensure they are in the correct sequence for perspective transform
            let sortedMarks = [
                marks.find(m => m.isTop && m.isLeft),    // top-left
                marks.find(m => m.isTop && !m.isLeft),   // top-right
                marks.find(m => !m.isTop && !m.isLeft),  // bottom-right
                marks.find(m => !m.isTop && m.isLeft)    // bottom-left
            ];
            
            // Replace the original array contents
            marks.length = 0;
            sortedMarks.forEach(mark => {
                if (mark) marks.push(mark);
            });
        }

        function applyPerspectiveTransform(src, marks) {
            // Create source points from registration marks
            let srcPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                marks[0].center.x, marks[0].center.y,  // top-left
                marks[1].center.x, marks[1].center.y,  // top-right
                marks[2].center.x, marks[2].center.y,  // bottom-right
                marks[3].center.x, marks[3].center.y   // bottom-left
            ]);
            
            // Target size for the transformed image (fixed ratio)
            const targetWidth = 800;
            const targetHeight = 600;
            
            // Create destination points (rectangle)
            let dstPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,                     // top-left
                targetWidth, 0,           // top-right
                targetWidth, targetHeight, // bottom-right
                0, targetHeight           // bottom-left
            ]);
            
            // Calculate perspective transform matrix
            let M = cv.getPerspectiveTransform(srcPoints, dstPoints);
            
            // Apply perspective transformation
            let dst = new cv.Mat();
            cv.warpPerspective(src, dst, M, new cv.Size(targetWidth, targetHeight));
            
            // Clean up
            srcPoints.delete();
            dstPoints.delete();
            M.delete();
            
            return dst;
        }

        function detectGridCells(img) {
            // Grid dimensions
            const numRows = 8;  // 8 instruments
            const numCols = 16; // 16 time steps
            
            // Calculate cell dimensions
            const imgWidth = img.cols;
            const imgHeight = img.rows;
            
            // Estimate the grid area (excluding margins)
            const gridMarginX = imgWidth * 0.1;
            const gridMarginY = imgHeight * 0.15;
            const gridWidth = imgWidth - 2 * gridMarginX;
            const gridHeight = imgHeight - 2 * gridMarginY;
            
            const cellWidth = gridWidth / numCols;
            const cellHeight = gridHeight / numRows;
            
            // Initialize result grid
            let grid = Array(numRows).fill().map(() => Array(numCols).fill(false));
            
            // For each cell, check if it's filled
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numCols; col++) {
                    // Calculate cell center
                    const cellX = Math.floor(gridMarginX + col * cellWidth + cellWidth / 2);
                    const cellY = Math.floor(gridMarginY + row * cellHeight + cellHeight / 2);
                    
                    // Get a sample region around the center
                    const sampleRadius = Math.floor(Math.min(cellWidth, cellHeight) * 0.3);
                    
                    let filledPixels = 0;
                    let totalPixels = 0;
                    
                    // Sample pixels in a square around the center
                    for (let y = -sampleRadius; y <= sampleRadius; y++) {
                        for (let x = -sampleRadius; x <= sampleRadius; x++) {
                            const sX = cellX + x;
                            const sY = cellY + y;
                            
                            // Ensure we're within image bounds
                            if (sX >= 0 && sX < imgWidth && sY >= 0 && sY < imgHeight) {
                                // Get pixel value (0-255, where 0 is black)
                                const pixelValue = img.ucharPtr(sY, sX)[0];
                                totalPixels++;
                                
                                // Consider dark pixels as filled (threshold at 100)
                                if (pixelValue < 100) {
                                    filledPixels++;
                                }
                            }
                        }
                    }
                    
                    // If more than 30% of sampled pixels are dark, consider the cell filled
                    const filledRatio = filledPixels / totalPixels;
                    grid[row][col] = filledRatio > 0.3;
                }
            }
            
            return grid;
        }

        function displayResults(grid) {
            // Create table
            let table = document.createElement('table');
            table.className = 'drum-grid';
            
            // Add header row with beat numbers
            let headerRow = document.createElement('tr');
            let cornerCell = document.createElement('th');
            headerRow.appendChild(cornerCell);
            
            for (let i = 1; i <= steps; i++) {
                let th = document.createElement('th');
                th.textContent = i;
                headerRow.appendChild(th);
            }
            
            table.appendChild(headerRow);
            
            // Add rows for each instrument
            for (let i = 0; i < instruments.length; i++) {
                let row = document.createElement('tr');
                
                // Instrument name
                let instrumentCell = document.createElement('td');
                instrumentCell.className = 'instrument';
                instrumentCell.textContent = instruments[i];
                row.appendChild(instrumentCell);
                
                // Cells for each step
                for (let j = 0; j < steps; j++) {
                    let cell = document.createElement('td');
                    if (grid[i][j]) {
                        cell.className = 'filled';
                    }
                    row.appendChild(cell);
                }
                
                table.appendChild(row);
            }
            
            // Clear previous results and add new table
            gridContainer.innerHTML = '';
            gridContainer.appendChild(table);
            
            // Generate export data
            generateExportData(grid);
            
            // Show export section
            exportSection.style.display = 'block';
        }

        function generateExportData(grid) {
            let data = {};
            
            // Create a pattern object
            for (let i = 0; i < instruments.length; i++) {
                data[instruments[i].toLowerCase()] = [];
                
                for (let j = 0; j < steps; j++) {
                    if (grid[i][j]) {
                        data[instruments[i].toLowerCase()].push(j + 1); // 1-based index for beats
                    }
                }
            }
            
            // Convert to JSON for export
            exportData.value = JSON.stringify(data, null, 2);
        }

        function displayError(message) {
            statusText.textContent = message;
            console.error(message);
        }

        // Initialize empty grid on load
        function initializeEmptyGrid() {
            let emptyGrid = Array(instruments.length).fill().map(() => Array(steps).fill(false));
            displayResults(emptyGrid);
        }

        // Initialize when OpenCV is loaded
        function onOpenCvReady() {
            document.getElementById('status').textContent = 'OpenCV.js loaded. Press "Start Camera" to begin.';
            document.getElementById('startBtn').disabled = false;
            initializeEmptyGrid();
        }

        // Check if OpenCV.js is already loaded
        if (typeof cv !== 'undefined') {
            onOpenCvReady();
        } else {
            // If not, we'll wait for the script to load
            var script = document.createElement('script');
            script.setAttribute('async', '');
            script.setAttribute('type', 'text/javascript');
            script.addEventListener('load', onOpenCvReady);
            script.addEventListener('error', function() {
                document.getElementById('status').textContent = 'Failed to load OpenCV.js. Please check your internet connection.';
            });
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.5.5/opencv.js';
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
