<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Drum Grid Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        video, canvas {
            width: 100%;
            max-width: 640px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: auto repeat(16, 1fr);
            gap: 2px;
            margin-top: 20px;
        }
        
        .grid-cell {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid #000;
            box-sizing: border-box;
        }
        
        .row-label {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-weight: bold;
        }
        
        .filled {
            background-color: #000;
        }
        
        .grid-header {
            text-align: center;
            font-weight: bold;
            padding: 5px 0;
        }
        
        #results {
            margin-top: 20px;
            text-align: left;
            border: 1px solid #ddd;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Simple Drum Grid Detector</h1>
    <p>A lightweight tool to detect filled cells in a drum grid pattern.</p>
    
    <div>
        <button id="startCamera">Start Camera</button>
        <button id="captureImage" disabled>Capture Image</button>
        <button id="processImage" disabled>Detect Filled Cells</button>
    </div>
    
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
    </div>
    
    <div id="canvasContainer" style="display: none;">
        <canvas id="captureCanvas"></canvas>
        <canvas id="processedCanvas"></canvas>
    </div>
    
    <div id="gridDisplay" class="grid-container">
        <!-- Will be populated dynamically -->
    </div>
    
    <div id="results">
        <h3>Detected Filled Cells:</h3>
        <div id="detectedCells"></div>
    </div>
    
    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const captureCanvas = document.getElementById('captureCanvas');
        const processedCanvas = document.getElementById('processedCanvas');
        const startCameraButton = document.getElementById('startCamera');
        const captureButton = document.getElementById('captureImage');
        const processButton = document.getElementById('processImage');
        const canvasContainer = document.getElementById('canvasContainer');
        const gridDisplay = document.getElementById('gridDisplay');
        const detectedCells = document.getElementById('detectedCells');
        
        // Grid configuration
        const rowLabels = ['KICK', 'HAT', 'SNARE', 'CLAP', 'TOM', 'CRASH', 'COW', 'TAMB'];
        const cols = 16;
        
        // Variables
        let stream = null;
        
        // Initialize grid display
        function initializeGridDisplay() {
            gridDisplay.innerHTML = '';
            
            // Add empty corner cell
            const cornerCell = document.createElement('div');
            gridDisplay.appendChild(cornerCell);
            
            // Add column headers
            for (let i = 1; i <= cols; i++) {
                const header = document.createElement('div');
                header.className = 'grid-header';
                header.textContent = i;
                gridDisplay.appendChild(header);
            }
            
            // Add rows
            for (let row = 0; row < rowLabels.length; row++) {
                // Add row label
                const rowLabel = document.createElement('div');
                rowLabel.className = 'row-label';
                rowLabel.textContent = rowLabels[row];
                gridDisplay.appendChild(rowLabel);
                
                // Add cells for this row
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${row}-${col}`;
                    gridDisplay.appendChild(cell);
                }
            }
        }
        
        // Start camera
        startCameraButton.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                startCameraButton.disabled = true;
                captureButton.disabled = false;
                
                // Initialize grid
                initializeGridDisplay();
                
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Could not access camera: ' + err.message);
            }
        });
        
        // Capture image
        captureButton.addEventListener('click', () => {
            if (!stream) return;
            
            // Set canvas dimensions to match video
            captureCanvas.width = video.videoWidth;
            captureCanvas.height = video.videoHeight;
            
            // Draw video frame to canvas
            const ctx = captureCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
            
            // Show canvas and hide video
            canvasContainer.style.display = 'block';
            processButton.disabled = false;
        });
        
        // Process image
        processButton.addEventListener('click', () => {
            // Reset previous results
            resetGridDisplay();
            
            // Get captured image data
            const captureCtx = captureCanvas.getContext('2d');
            const imageData = captureCtx.getImageData(0, 0, captureCanvas.width, captureCanvas.height);
            
            // Process the image
            processImageData(imageData);
        });
        
        // Reset grid display
        function resetGridDisplay() {
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                cell.classList.remove('filled');
            });
            
            detectedCells.innerHTML = '';
        }
        
        // Process image data to find filled cells
        function processImageData(imageData) {
            // Create processed canvas for visualization
            processedCanvas.width = imageData.width;
            processedCanvas.height = imageData.height;
            const processedCtx = processedCanvas.getContext('2d');
            
            // Draw original image
            processedCtx.putImageData(imageData, 0, 0);
            
            // Overlay grid for visualization
            const gridRows = rowLabels.length;
            const gridCols = cols;
            
            // Estimate grid position (in a real app, this would be more sophisticated)
            // Assuming the grid takes up most of the image
            const margin = 0.1; // 10% margin
            const gridTop = imageData.height * margin;
            const gridLeft = imageData.width * margin;
            const gridWidth = imageData.width * (1 - 2 * margin);
            const gridHeight = imageData.height * (1 - 2 * margin);
            
            // Draw grid overlay
            processedCtx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
            processedCtx.lineWidth = 2;
            processedCtx.strokeRect(gridLeft, gridTop, gridWidth, gridHeight);
            
            // Calculate cell dimensions
            const cellWidth = gridWidth / gridCols;
            const cellHeight = gridHeight / gridRows;
            
            // Array to store filled cells
            const filledCells = [];
            
            // Check each cell
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    // Calculate cell position
                    const cellLeft = gridLeft + col * cellWidth;
                    const cellTop = gridTop + row * cellHeight;
                    
                    // Sample points within the cell
                    const darkPixelThreshold = 100; // Threshold for considering a pixel "dark"
                    const darkPixelPercentageThreshold = 0.3; // Percentage of dark pixels to consider a cell filled
                    
                    // Count dark pixels in cell
                    let darkPixelCount = 0;
                    let totalSamples = 0;
                    
                    // Sample a grid of points within the cell
                    const sampleSteps = 5;
                    for (let y = 0; y < sampleSteps; y++) {
                        for (let x = 0; x < sampleSteps; x++) {
                            const sampleX = Math.floor(cellLeft + (x + 0.5) * (cellWidth / sampleSteps));
                            const sampleY = Math.floor(cellTop + (y + 0.5) * (cellHeight / sampleSteps));
                            
                            // Get pixel data at sample point
                            if (sampleX >= 0 && sampleX < imageData.width && 
                                sampleY >= 0 && sampleY < imageData.height) {
                                
                                const pixelIndex = (sampleY * imageData.width + sampleX) * 4;
                                const r = imageData.data[pixelIndex];
                                const g = imageData.data[pixelIndex + 1];
                                const b = imageData.data[pixelIndex + 2];
                                
                                // Calculate grayscale value
                                const grayscale = 0.299 * r + 0.587 * g + 0.114 * b;
                                
                                // Check if pixel is dark
                                if (grayscale < darkPixelThreshold) {
                                    darkPixelCount++;
                                }
                                
                                totalSamples++;
                            }
                        }
                    }
                    
                    // Calculate percentage of dark pixels
                    const darkPixelPercentage = darkPixelCount / totalSamples;
                    
                    // Determine if cell is filled
                    if (darkPixelPercentage > darkPixelPercentageThreshold) {
                        filledCells.push({
                            row: row,
                            col: col,
                            name: `${rowLabels[row]}-${col + 1}`
                        });
                        
                        // Mark cell as filled in UI
                        const cell = document.getElementById(`cell-${row}-${col}`);
                        if (cell) {
                            cell.classList.add('filled');
                        }
                        
                        // Draw filled cell outline
                        processedCtx.strokeStyle = 'rgba(0, 255, 0, 0.8)';
                        processedCtx.strokeRect(cellLeft, cellTop, cellWidth, cellHeight);
                    }
                }
            }
            
            // Display results
            if (filledCells.length === 0) {
                detectedCells.textContent = 'No filled cells detected.';
            } else {
                detectedCells.innerHTML = '';
                filledCells.forEach(cell => {
                    const cellElement = document.createElement('div');
                    cellElement.textContent = cell.name;
                    detectedCells.appendChild(cellElement);
                });
            }
            
            console.log('Filled cells:', filledCells);
        }
    </script>
</body>
</html>
